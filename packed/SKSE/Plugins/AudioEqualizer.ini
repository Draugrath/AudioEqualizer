# Audio Equalizer settings. The in-game Save button rewrites this file.

# Turns the equalizer on or off.
bEnabled = true

# Input gain in dB before the EQ, from -24 to 24.
fInputGain = 0

# Output gain in dB after the EQ, from -24 to 24.
fOutputGain = 0

# Spectral balance toward pink noise in percent, 0 turns it off.
fBalance = 0

# Automatic gain, keeps the loudness level when the EQ or Balance changes it.
bAutoGain = false

# Key that opens the menu, as a Windows key code (115 = F4).
iToggleKey = 115

# Size of the equalizer window: 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5 or 3 (2 suits 4K screens).
fWindowScale = 1

# Each band: on (0 or 1), type (0 bell, 1 low shelf, 2 high shelf, 3 low pass, 4 high pass), frequency in Hz, gain in dB, Q, slope for low and high pass (12, 24, 48 or 96 dB per octave).
Band0 = 1, 1, 80, 0, 1, 12
Band1 = 1, 0, 200, 0, 1, 12
Band2 = 1, 0, 500, 0, 1, 12
Band3 = 1, 0, 1000, 0, 1, 12
Band4 = 1, 0, 2500, 0, 1, 12
Band5 = 1, 0, 5000, 0, 1, 12
Band6 = 1, 0, 10000, 0, 1, 12
Band7 = 1, 2, 14000, 0, 1, 12
